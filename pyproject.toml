[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wallet-recover-local"
# Version lives in wallet_recover/__init__.py only (see [tool.setuptools.dynamic]).
dynamic = ["version"]
description = "AI-powered offline/online password recovery for authorized legacy Bitcoin Core wallets"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Alexander K."}]
keywords = ["bitcoin", "wallet", "password-recovery", "berkeley-db", "secp256k1"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security :: Cryptography",
]
requires-python = ">=3.8"
dependencies = [
    "pycryptodome>=3.20",
    "cryptography==42.0.7; python_version < '3.9' and sys_platform == 'win32'",
    "cryptography>=42,<51; python_version >= '3.9' or sys_platform != 'win32'",
    "berkeleydb>=18.1,<18.1.16; python_version == '3.10'",
    "berkeleydb>=18.1; python_version >= '3.11'",
    "bsddb3>=6.2.9; python_version < '3.10'",
]

[project.optional-dependencies]
fast = ["coincurve>=20"]
ai = ["numpy>=1.22", "openai>=1.0"]
test = ["pytest>=7,<10", "numpy>=1.22", "openai>=1.0"]

[project.scripts]
wallet-recover = "wallet_recover.cli:main"

[project.gui-scripts]
wallet-recover-gui = "wallet_recover.gui:main"

[tool.setuptools.dynamic]
version = {attr = "wallet_recover.__init__.__version__"}

[tool.setuptools.packages.find]
include = ["wallet_recover*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
