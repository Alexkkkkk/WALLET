name: Build & Test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: System libraries (Berkeley DB, Tk, Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdb-dev libdb++-dev build-essential python3-dev python3-tk xvfb

      - name: Upgrade build tooling
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install runtime deps
        run: pip install -r requirements.txt

      - name: Install project (editable, deps already satisfied)
        run: pip install --no-deps -e .

      - name: Install test extras
        run: pip install -r requirements-dev.txt

      - name: Syntax check (Python 3.8 grammar)
        run: |
          python - <<'PY'
          import ast, pathlib
          files = sorted(pathlib.Path("wallet_recover").rglob("*.py"))
          for p in files:
              ast.parse(p.read_text(encoding="utf-8"), filename=str(p), feature_version=(3, 8))
          print("syntax ok:", len(files), "files")
          PY

      - name: Self-test
        run: python -m wallet_recover --selftest

      - name: Tests (CLI + AI + GUI under Xvfb)
        run: xvfb-run -a python -m pytest -q

      - name: End-to-end recovery on synthetic wallet
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys, tempfile
          sys.path.insert(0, "tests")
          from test_runner import make_wallet, PASSWORD

          d = pathlib.Path(tempfile.mkdtemp())
          wallet = d / "wallet-backup.dat"
          make_wallet(wallet)
          words = d / "words.txt"
          words.write_bytes(b"wrong-password\nhunter2\n" + PASSWORD + b"\n")
          out = d / "found.bin"

          r = subprocess.run(
              [sys.executable, "-m", "wallet_recover",
               "--wallet", str(wallet), "--wordlist", str(words),
               "--jobs", "2", "--save", str(out)],
              capture_output=True, text=True)
          print(r.stdout, r.stderr)
          assert r.returncode == 0, r.returncode
          assert out.read_bytes() == PASSWORD, out.read_bytes()
          assert (out.stat().st_mode & 0o777) == 0o600, oct(out.stat().st_mode)
          print("e2e ok: password recovered, output file mode 0600")
          PY

  package:
    name: package (sdist + wheel)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: System libraries (Berkeley DB)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdb-dev libdb++-dev build-essential

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      - name: Verify wheel installs and runs in a clean venv
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install --quiet dist/*.whl
          /tmp/wheel-check/bin/python -c "import wallet_recover, berkeleydb; print('import ok')"
          /tmp/wheel-check/bin/python -c "import wallet_recover.bdb as b; print('bdb backend:', b.backend_name())"
          /tmp/wheel-check/bin/wallet-recover --selftest
          /tmp/wheel-check/bin/python -c "import wallet_recover.gui" || echo "GUI import needs Tk (expected on headless runner)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-py3.12
          path: dist/*
          if-no-files-found: error

  release:
    name: attach artifacts to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-py3.12
          path: dist

      - name: Create release and upload sdist/wheel
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
