name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: System libraries (Berkeley DB, Tk, Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y libdb-dev libdb++-dev build-essential python3-dev python3-tk xvfb
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[ai,test]'
      - name: Syntax check (Python 3.8 grammar)
        run: python - <<'EOF'
          import ast, pathlib
          for p in pathlib.Path("wallet_recover").rglob("*.py"):
              ast.parse(p.read_text(encoding="utf-8"), filename=str(p), feature_version=(3, 8))
          print("ok")
          EOF
      - name: Self-test
        run: python -m wallet_recover --selftest
      - name: Tests (CLI + AI + GUI under Xvfb)
        run: xvfb-run -a python -m pytest -q
