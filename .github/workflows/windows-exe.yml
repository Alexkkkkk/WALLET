name: Windows EXE

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build-windows:
    name: Windows 10/11 x64 (Python ${{ matrix.python-version }})
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up official Python x64 with Tcl/Tk
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - name: Checkout pinned Microsoft vcpkg recipe
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: e54ef0fcc9a82033a61e51002552a910a5d57282
          path: .build/vcpkg

      - name: Build native Berkeley DB 4.8 (static, MSVC DLL runtime)
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $env:VCPKG_ROOT = (Resolve-Path .build/vcpkg).Path
          & .\.build\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          & .\.build\vcpkg\vcpkg.exe install berkeleydb:x64-windows-static-md --disable-metrics

      - name: Install native and Python dependencies
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade pip setuptools wheel
          python scripts/build_windows_bdb.py .build/vcpkg/installed/x64-windows-static-md .build/bdb-wheels
          python -m pip install -e ".[ai,test]" pyinstaller
          python -c "from Crypto.Cipher import AES; from cryptography.hazmat.primitives.asymmetric import ec; import berkeleydb.db, numpy, openai, tkinter; assert berkeleydb.db.version()[:2] == (4, 8); print('All runtime imports OK; BDB:', berkeleydb.db.version())"

      - name: Self-test and package test
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m wallet_recover --selftest
          python -m compileall -q wallet_recover wallet_recover.py scripts

      - name: Build one-file GUI executable
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m PyInstaller `
            --noconfirm --clean --onefile --console `
            --name WALLET `
            --collect-all=wallet_recover `
            --collect-all=berkeleydb `
            --collect-all=Crypto `
            --collect-all=cryptography `
            --collect-all=numpy `
            --collect-all=openai `
            wallet_recover.py
          if (-not (Test-Path dist/WALLET.exe)) { throw "dist/WALLET.exe was not created" }

      - name: Verify standalone EXE outside source directory
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python scripts/verify_windows_bundle.py dist/WALLET.exe

      - name: Create portable archive
        id: archive
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $version = (python -c "from wallet_recover import __version__; print(__version__)").Trim()
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag $env:GITHUB_REF_NAME does not match package v$version"
          }
          $asset = "WALLET-v$version-windows10-11-x64"
          if ("${{ matrix.python-version }}" -ne "3.12") { $asset += "-py${{ matrix.python-version }}" }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/WALLET.exe release/WALLET.exe
          Copy-Item README.md, LICENSE, examples release/ -Recurse
          Copy-Item .build/bdb-wheels/licenses release/THIRD-PARTY-LICENSES -Recurse
          @"
          WALLET v$version — Windows 10 / 11 x64 portable
          NOT FOR WINDOWS 7. This build uses Python ${{ matrix.python-version }}.

          Распакуйте ZIP и запустите WALLET.exe для открытия русского интерфейса.
          Python и pip устанавливать не нужно. Python, Tcl/Tk, Berkeley DB 4.8,
          cryptography, NumPy и OpenAI-клиент включены в EXE.
          Нативная BDB собрана статически по закреплённому рецепту Microsoft vcpkg.
          Ollama, его модели и Hashcat — отдельные необязательные программы.

          Проверки EXE: версия, self-test, офлайн AI, чтение синтетической BDB,
          восстановление синтетического пароля с двумя процессами и запуск GUI.
          CI работает на Windows Server 2022, не на Windows 7 или Windows 10.
          Проверенный EXE для Windows 7 пока не опубликован.

          Используйте только копию своего кошелька или с разрешения владельца.
          Не публикуйте кошелёк, словари и найденные пароли.
          Лицензия MIT относится к коду WALLET; сторонние компоненты имеют свои лицензии.
          "@ | Set-Content -Encoding UTF8 release/README-WINDOWS.txt
          python -m pip freeze | Set-Content -Encoding UTF8 release/BUILD-DEPENDENCIES.txt
          Compress-Archive -Path release/* -DestinationPath "$asset.zip" -Force
          $hash = (Get-FileHash "$asset.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset.zip" | Set-Content -Encoding ascii "$asset.zip.sha256"
          "asset=$asset" >> $env:GITHUB_OUTPUT

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: WALLET-windows10-11-x64-py${{ matrix.python-version }}
          path: |
            ${{ steps.archive.outputs.asset }}.zip
            ${{ steps.archive.outputs.asset }}.zip.sha256
          if-no-files-found: error
